const g = document.getElementById('gallery');
let current = 0;

images.forEach((img,i)=>{
  const el=document.createElement('img');
  el.src=img.src;
  el.onclick=()=>openLightbox(i);
  g.appendChild(el);
});

function openLightbox(i){
  current=i;
  document.getElementById('lightImg').src=images[i].src;
  document.getElementById('lightDesc').innerHTML=images[i].desc;
  document.getElementById('lightbox').style.display='flex';
}
function closeLightbox(){document.getElementById('lightbox').style.display='none'}
function nextImg(){current=(current+1)%images.length;openLightbox(current)}
function prevImg(){current=(current-1+images.length)%images.length;openLightbox(current)}
